name: Build hero scroll video

on:
  push:
    paths:
      - ".video-build/TRIGGER"

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild hero video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/video
          cat .video-build/part-*.bin > assets/video/kaiser-scroll-desktop.mp4
          echo "a3e02caab1743b39eb14bb7a9bef993c0ce59502f218e4f183719195e604d491  assets/video/kaiser-scroll-desktop.mp4" | sha256sum -c -
          test -s assets/video/kaiser-scroll-desktop.mp4

      - name: Commit rebuilt video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kaiser Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/video/kaiser-scroll-desktop.mp4
          git rm -r .video-build
          git rm .github/workflows/build-hero-video.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix hero scroll video asset"
          git push
